<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khắc phục lỗi Cache</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        .button {
            background: white;
            color: #667eea;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin: 10px 5px;
            transition: all 0.3s;
            width: 100%;
        }
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            font-family: monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .success {
            background: rgba(34, 197, 94, 0.3);
            border: 2px solid #22c55e;
        }
        .error {
            background: rgba(239, 68, 68, 0.3);
            border: 2px solid #ef4444;
        }
        .info {
            background: rgba(59, 130, 246, 0.3);
            border: 2px solid #3b82f6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Khắc phục lỗi đăng bài</h1>
        
        <div class="info" style="margin-bottom: 20px; padding: 15px; border-radius: 8px;">
            <strong>Vấn đề:</strong> Browser đang cache file cũ (chưa có token)<br>
            <strong>Giải pháp:</strong> Clear cache và reload token mới
        </div>

        <button class="button" onclick="step1()">Bước 1: Kiểm tra token hiện tại</button>
        <div id="result1" style="display:none;"></div>

        <button class="button" onclick="step2()">Bước 2: Clear cache</button>
        <div id="result2" style="display:none;"></div>

        <button class="button" onclick="step3()">Bước 3: Reload token mới</button>
        <div id="result3" style="display:none;"></div>

        <button class="button" onclick="step4()">Bước 4: Test lưu bài</button>
        <div id="result4" style="display:none;"></div>

        <div style="margin-top: 30px; text-align: center;">
            <button class="button" onclick="goToAdmin()" style="background: #22c55e; color: white;">
                ✅ Xong! Đi đến trang Admin
            </button>
        </div>
    </div>

    <script>
        function step1() {
            const result = document.getElementById('result1');
            result.style.display = 'block';
            
            // Remove old script tags
            const oldScripts = document.querySelectorAll('script[src*="github-config"]');
            oldScripts.forEach(s => s.remove());
            
            // Load fresh config
            const script = document.createElement('script');
            script.src = 'github-config.js?t=' + Date.now(); // Add timestamp to bypass cache
            script.onload = function() {
                if (window.GITHUB_CONFIG) {
                    const token = window.GITHUB_CONFIG.token;
                    if (token && token !== '') {
                        result.className = 'result success';
                        result.innerHTML = `
✅ Token đã có!
Owner: ${window.GITHUB_CONFIG.owner}
Repo: ${window.GITHUB_CONFIG.repo}
Token: ${token.substring(0, 15)}...
                        `;
                    } else {
                        result.className = 'result error';
                        result.innerHTML = `
❌ Token chưa có!
File github-config.js vẫn chưa có token.
Hãy kiểm tra lại file.
                        `;
                    }
                } else {
                    result.className = 'result error';
                    result.innerHTML = '❌ Không load được GITHUB_CONFIG!';
                }
            };
            script.onerror = function() {
                result.className = 'result error';
                result.innerHTML = '❌ Không thể load github-config.js!';
            };
            document.head.appendChild(script);
        }

        function step2() {
            const result = document.getElementById('result2');
            result.style.display = 'block';
            result.className = 'result success';
            result.innerHTML = `
✅ Đã xóa cache localStorage!
            
Đã xóa:
- blogPosts
- Cached data
            `;
            
            // Clear localStorage
            const keys = Object.keys(localStorage);
            const blogKeys = keys.filter(k => k.includes('blog') || k.includes('post'));
            blogKeys.forEach(k => localStorage.removeItem(k));
        }

        function step3() {
            const result = document.getElementById('result3');
            result.style.display = 'block';
            result.className = 'result info';
            result.innerHTML = 'Đang reload token...';
            
            // Force reload config with fresh timestamp
            const script = document.createElement('script');
            script.src = 'github-config.js?nocache=' + new Date().getTime();
            script.onload = function() {
                if (window.GITHUB_CONFIG && window.GITHUB_CONFIG.token) {
                    // Load storage
                    const storageScript = document.createElement('script');
                    storageScript.src = 'github-storage.js?nocache=' + new Date().getTime();
                    storageScript.onload = function() {
                        result.className = 'result success';
                        result.innerHTML = `
✅ Token và Storage đã được reload!
Sẵn sàng test lưu bài.
                        `;
                    };
                    document.head.appendChild(storageScript);
                } else {
                    result.className = 'result error';
                    result.innerHTML = '❌ Token vẫn chưa có sau khi reload!';
                }
            };
            document.head.appendChild(script);
        }

        async function step4() {
            const result = document.getElementById('result4');
            result.style.display = 'block';
            result.className = 'result info';
            result.innerHTML = 'Đang test lưu bài...';
            
            try {
                if (!window.GitHubStorage || !window.GITHUB_CONFIG) {
                    throw new Error('GitHubStorage hoặc GITHUB_CONFIG chưa được load!');
                }
                
                const storage = new GitHubStorage(window.GITHUB_CONFIG);
                
                // Test data
                const testPost = [{
                    id: Date.now().toString(),
                    title: 'Test - ' + new Date().toLocaleString('vi-VN'),
                    content: 'Đây là bài test để kiểm tra hệ thống',
                    status: 'published',
                    createdAt: new Date().toISOString()
                }];
                
                const success = await storage.savePosts(testPost);
                
                if (success) {
                    result.className = 'result success';
                    result.innerHTML = `
✅ LƯU BÀI THÀNH CÔNG!

Bài test đã được lưu lên GitHub!
Kiểm tra tại: https://github.com/${window.GITHUB_CONFIG.owner}/${window.GITHUB_CONFIG.repo}/blob/main/posts.json

🎉 Hệ thống hoạt động tốt!
Bạn có thể đăng bài bình thường.
                    `;
                } else {
                    result.className = 'result error';
                    result.innerHTML = `
❌ LƯU BÀI THẤT BẠI!

Vui lòng mở Console (F12) để xem chi tiết lỗi.
                    `;
                }
            } catch (error) {
                result.className = 'result error';
                result.innerHTML = `
❌ LỖI!
${error.message}

Stack: ${error.stack}
                `;
            }
        }

        function goToAdmin() {
            window.location.href = 'admin-instant.html';
        }
    </script>
</body>
</html>
