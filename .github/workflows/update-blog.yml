name: Update Blog Posts

# Chạy workflow khi có file posts.json được update
on:
  push:
    paths:
      - 'posts.json'
    branches:
      - main

  # Cho phép chạy thủ công
  workflow_dispatch:

# Sử dụng secret token của bạn
env:
  GITHUB_TOKEN: ${{ secrets.token }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pages: write
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.token }}
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.token }}
          publish_dir: ./
          publish_branch: gh-pages
          force_orphan: true
