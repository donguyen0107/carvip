<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test GitHub API Connection</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        .test-section {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            margin: 15px 0;
            border-radius: 10px;
            border-left: 4px solid #fff;
        }
        .result {
            margin-top: 10px;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .success {
            background: rgba(34, 197, 94, 0.3);
            border: 2px solid #22c55e;
        }
        .error {
            background: rgba(239, 68, 68, 0.3);
            border: 2px solid #ef4444;
        }
        .info {
            background: rgba(59, 130, 246, 0.3);
            border: 2px solid #3b82f6;
        }
        button {
            background: white;
            color: #667eea;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin: 10px 5px;
            transition: all 0.3s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Kiểm tra GitHub API</h1>
        
        <div class="test-section">
            <h3>📋 Thông tin cấu hình</h3>
            <div id="config-info" class="result info">Đang tải...</div>
        </div>

        <div class="test-section">
            <h3>🔑 Test 1: Kiểm tra Token</h3>
            <button onclick="testToken()">Chạy Test</button>
            <div id="token-result" class="result" style="display:none;"></div>
        </div>

        <div class="test-section">
            <h3>📦 Test 2: Kiểm tra Repository</h3>
            <button onclick="testRepo()">Chạy Test</button>
            <div id="repo-result" class="result" style="display:none;"></div>
        </div>

        <div class="test-section">
            <h3>📄 Test 3: Kiểm tra File posts.json</h3>
            <button onclick="testFile()">Chạy Test</button>
            <div id="file-result" class="result" style="display:none;"></div>
        </div>

        <div class="test-section">
            <h3>✍️ Test 4: Thử tạo/cập nhật file</h3>
            <button onclick="testWrite()">Chạy Test</button>
            <div id="write-result" class="result" style="display:none;"></div>
        </div>
    </div>

    <script src="github-config.js"></script>
    <script src="github-storage.js"></script>
    <script>
        // Hiển thị thông tin cấu hình
        document.addEventListener('DOMContentLoaded', function() {
            const configInfo = document.getElementById('config-info');
            configInfo.innerHTML = `
Owner: ${GITHUB_CONFIG.owner}
Repo: ${GITHUB_CONFIG.repo}
Branch: ${GITHUB_CONFIG.branch}
Token: ${GITHUB_CONFIG.token ? '✅ Đã có (' + GITHUB_CONFIG.token.substring(0, 10) + '...)' : '❌ Chưa có'}
            `;
        });

        const storage = new GitHubStorage(GITHUB_CONFIG);

        async function testToken() {
            const resultDiv = document.getElementById('token-result');
            resultDiv.style.display = 'block';
            resultDiv.className = 'result info';
            resultDiv.innerHTML = '<div class="loading"></div> Đang kiểm tra token...';

            try {
                const response = await fetch('https://api.github.com/user', {
                    headers: {
                        'Authorization': `token ${GITHUB_CONFIG.token}`
                    }
                });

                if (response.ok) {
                    const user = await response.json();
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
✅ Token hợp lệ!
User: ${user.login}
Name: ${user.name || 'N/A'}
Email: ${user.email || 'N/A'}
                    `;
                } else {
                    const error = await response.json();
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `
❌ Token không hợp lệ!
Status: ${response.status}
Message: ${error.message}

⚠️ Khắc phục:
1. Kiểm tra token có đúng không
2. Token có thể đã hết hạn
3. Tạo token mới tại: https://github.com/settings/tokens
                    `;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
❌ Lỗi kết nối!
${error.message}
                `;
            }
        }

        async function testRepo() {
            const resultDiv = document.getElementById('repo-result');
            resultDiv.style.display = 'block';
            resultDiv.className = 'result info';
            resultDiv.innerHTML = '<div class="loading"></div> Đang kiểm tra repository...';

            try {
                const url = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}`;
                const response = await fetch(url, {
                    headers: {
                        'Authorization': `token ${GITHUB_CONFIG.token}`
                    }
                });

                if (response.ok) {
                    const repo = await response.json();
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
✅ Repository tồn tại và có quyền truy cập!
Name: ${repo.name}
Full name: ${repo.full_name}
Private: ${repo.private ? 'Yes' : 'No'}
Default branch: ${repo.default_branch}
Permissions: 
  - Admin: ${repo.permissions.admin ? '✅' : '❌'}
  - Push: ${repo.permissions.push ? '✅' : '❌'}
  - Pull: ${repo.permissions.pull ? '✅' : '❌'}
                    `;
                } else {
                    const error = await response.json();
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `
❌ Không thể truy cập repository!
Status: ${response.status}
Message: ${error.message}

⚠️ Khắc phục:
1. Kiểm tra tên repo: ${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}
2. Token cần có quyền 'repo'
3. Đảm bảo repository đã được tạo
                    `;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
❌ Lỗi kết nối!
${error.message}
                `;
            }
        }

        async function testFile() {
            const resultDiv = document.getElementById('file-result');
            resultDiv.style.display = 'block';
            resultDiv.className = 'result info';
            resultDiv.innerHTML = '<div class="loading"></div> Đang kiểm tra file posts.json...';

            try {
                const url = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/posts.json?ref=${GITHUB_CONFIG.branch}`;
                const response = await fetch(url, {
                    headers: {
                        'Authorization': `token ${GITHUB_CONFIG.token}`
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
✅ File posts.json đã tồn tại!
SHA: ${data.sha}
Size: ${data.size} bytes
URL: ${data.html_url}
                    `;
                } else if (response.status === 404) {
                    resultDiv.className = 'result info';
                    resultDiv.innerHTML = `
ℹ️ File posts.json chưa tồn tại
Đây là điều bình thường nếu chưa đăng bài nào.
File sẽ được tạo tự động khi bạn đăng bài đầu tiên.
                    `;
                } else {
                    const error = await response.json();
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `
❌ Lỗi khi kiểm tra file!
Status: ${response.status}
Message: ${error.message}
                    `;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
❌ Lỗi kết nối!
${error.message}
                `;
            }
        }

        async function testWrite() {
            const resultDiv = document.getElementById('write-result');
            resultDiv.style.display = 'block';
            resultDiv.className = 'result info';
            resultDiv.innerHTML = '<div class="loading"></div> Đang thử ghi file...';

            try {
                // Tạo dữ liệu test
                const testData = [{
                    id: Date.now().toString(),
                    title: 'Test Post - ' + new Date().toLocaleString('vi-VN'),
                    content: 'Đây là bài test để kiểm tra GitHub API',
                    status: 'published',
                    createdAt: new Date().toISOString()
                }];

                const success = await storage.savePosts(testData);

                if (success) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
✅ Ghi file thành công!
Kiểm tra tại: https://github.com/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/blob/${GITHUB_CONFIG.branch}/posts.json

🎉 Hệ thống hoạt động tốt!
Bạn có thể đăng bài bình thường.
                    `;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `
❌ Không thể ghi file!
Vui lòng kiểm tra Console (F12) để xem chi tiết lỗi.
                    `;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
❌ Lỗi khi ghi file!
${error.message}

Stack trace:
${error.stack}
                `;
            }
        }
    </script>
</body>
</html>
